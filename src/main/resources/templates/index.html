<!DOCTYPE html>
<html lang="en">

    <title>Calisto</title>
    <link rel="icon" type="image/svg" href="/icons/favicon.svg">
    <link rel="stylesheet" href="/style/master.css">
    <link rel="stylesheet" href="/style/index.css">
</head>

    <section class="gallery" th:utext="${gallery}">
    </section>

</html>
